<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Request for Information</title>
<style>
  :root { --ink:#1d1d1d; --mute:#555; --line:#bbb; --bg:#f6f6f4; }
  * { box-sizing: border-box; }
  body { font: 14px/1.45 "Segoe UI", system-ui, sans-serif; color: var(--ink); margin: 0; }
  header { padding: 12px 16px; background: var(--bg); border-bottom: 2px solid var(--ink); display: flex; justify-content: space-between; align-items: baseline; }
  header h1 { font-size: 18px; margin: 0; letter-spacing: .5px; }
  header .no { font-weight: 600; }
  main { padding: 10px 16px 70px; }
  .grid { display: grid; grid-template-columns: 140px 1fr 140px 1fr; gap: 6px 10px; border: 1px solid var(--line); padding: 10px; margin-bottom: 12px; }
  .grid .k { color: var(--mute); font-size: 12px; text-transform: uppercase; letter-spacing: .4px; padding-top: 2px; }
  .grid .v { font-weight: 600; }
  label { display: block; font-weight: 600; margin: 10px 0 4px; }
  textarea { width: 100%; min-height: 150px; font: inherit; padding: 8px; border: 1px solid #888; border-radius: 3px; resize: vertical; }
  .note { color: var(--mute); font-size: 12px; margin-top: 6px; }
  .err { color: #b3261e; font-weight: 600; min-height: 1.2em; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); padding: 10px 16px; display: flex; gap: 8px; justify-content: flex-end; }
  button { font: inherit; padding: 7px 16px; border: 1px solid #888; background: #fff; border-radius: 4px; cursor: pointer; }
  button.primary { background: #1d1d1d; color: #fff; border-color: #1d1d1d; }
</style>
</head>
<body>
<header><h1>REQUEST FOR INFORMATION</h1><span class="no" id="no"></span></header>
<main>
  <div class="grid">
    <div class="k">Project</div><div class="v" id="project"></div>
    <div class="k">Date</div><div class="v" id="date"></div>
    <div class="k">Wall</div><div class="v" id="wall"></div>
    <div class="k">Opening</div><div class="v" id="mark"></div>
    <div class="k">Rough opening</div><div class="v" id="ro"></div>
    <div class="k">Subject</div><div class="v">Header size</div>
  </div>
  <label for="q">Question</label>
  <textarea id="q"></textarea>
  <div class="note">Say what you checked (plans, general notes, schedules) and exactly what you need answered.
    The opening is on hold until the answer comes back - keep working on other openings and walls in the meantime.</div>
  <div class="err" id="err"></div>
</main>
<div class="bar">
  <button id="cancel">Cancel</button>
  <button class="primary" id="send">Submit RFI</button>
</div>
<script>
function $(id) { return document.getElementById(id); }
function load(s) {
  $('no').textContent = 'RFI #' + s.n;
  $('project').textContent = s.project; $('date').textContent = s.date;
  $('wall').textContent = s.wall; $('mark').textContent = s.mark + ' (' + s.type + ')'; $('ro').textContent = s.ro;
  $('q').value = s.question; $('q').focus();
}
$('send').onclick = function () {
  var q = $('q').value.trim();
  if (q.length < 10) { $('err').textContent = 'Write out your question before submitting.'; return; }
  sketchup.submit(JSON.stringify({ question: q }));
};
$('cancel').onclick = function () { sketchup.cancel(''); };
window.onload = function () { sketchup.ready(''); };
</script>
</body>
</html>
